const btnText = "Comprar →";
function render(list){
  document.getElementById('grid').innerHTML = list.map(p => `
    <div class="card">
      <img src="${p.image_link}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'" loading="lazy">
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-brand">${p.brand} • ${p.category.split('>').pop() || ''}</div>
        <div class="card-price">${p.price}</div>
      </div>
      <div class="card-footer"><a class="buy-btn" href="${p.link}" target="_blank" rel="noopener">${btnText}</a></div>
    </div>
  `).join('');
}
render(PRODUCTS);
document.getElementById('search').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase();
  const filtered = PRODUCTS.filter(p=> !q || p.title.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q));
  render(filtered);
});
</script>
